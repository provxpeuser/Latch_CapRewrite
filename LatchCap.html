<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auto Send</title>
</head>
<body>

<script>
fetch("https://LatchonlybapsCDN.b-cdn.netMain", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        message: "Auto sent request"
    })
})
.then(res => res.text())
.then(data => console.log(data))
.catch(err => console.error(err));
</script>
